<svg viewBox="0 130 1200 660" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Mabry Pro', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Regional stakeholder model for carbon regulation</title>
  <desc>Central node “The experiment’s scope” with six roles around it: experiment coordinator, authorised body, regulated organisations, operator of the Carbon Units Registry, trading platforms and climate projects.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a491"/>
    </marker>
  </defs>

  <!-- ===== LINKS ===== -->
  <!-- coordinator -> authorised body -->
  <path d="M205,297 L205,355" stroke="#94a491" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <!-- authorised body -> centre -->
  <path d="M380,440 L440,440" stroke="#94a491" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <!-- centre -> regulated organisations -->
  <path d="M600,280 L600,222 A12,12 0 0 1 612,210 L820,210" stroke="#94a491" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <!-- centre -> registry operator -->
  <path d="M760,440 L820,440" stroke="#94a491" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <!-- centre -> trading platforms -->
  <path d="M640,600 L640,683 A12,12 0 0 0 652,695 L820,695" stroke="#94a491" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <!-- centre -> climate projects -->
  <path d="M560,600 L560,683 A12,12 0 0 1 548,695 L380,695" stroke="#94a491" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- ===== CENTRE ===== -->
  <circle cx="600" cy="440" r="150" fill="none" stroke="#94a491" stroke-width="1.5"/>
  <text x="600" y="418" text-anchor="middle" fill="#1a1a1a" font-size="16" font-weight="700">Federal Laws No. 296-FZ and 34-FZ</text>
  <text x="600" y="453" text-anchor="middle" fill="#1a1a1a" font-size="24" font-weight="700">The experiment’s</text>
  <text x="600" y="482" text-anchor="middle" fill="#1a1a1a" font-size="24" font-weight="700">scope</text>

  <!-- ===== LEFT COLUMN ===== -->
  <!-- EXPERIMENT COORDINATOR -->
  <rect x="40" y="150" width="330" height="137" rx="16" fill="none" stroke="#94a491" stroke-width="1.5"/>
  <text x="60" y="187" fill="#1a1a1a" font-size="21" font-weight="700">Experiment coordinator</text>
  <text x="60" y="212" fill="rgba(26,26,26,0.55)" font-size="15">Federal executive authority – Russian</text>
  <text x="60" y="231" fill="rgba(26,26,26,0.55)" font-size="15">Ministry of Economic Development</text>
  <rect x="60" y="245" width="109" height="28" rx="7" fill="rgba(148,164,145,0.18)"/>
  <text x="114.5" y="264" text-anchor="middle" fill="#1a1a1a" font-size="15">Regulations</text>

  <!-- AUTHORISED BODY -->
  <rect x="40" y="355" width="330" height="169" rx="16" fill="none" stroke="#94a491" stroke-width="1.5"/>
  <text x="60" y="392" fill="#1a1a1a" font-size="21" font-weight="700">Authorised body</text>
  <text x="60" y="417" fill="rgba(26,26,26,0.55)" font-size="15">Regional executive authority –</text>
  <text x="60" y="436" fill="rgba(26,26,26,0.55)" font-size="15">Government of the Sakhalin Region</text>
  <rect x="60" y="450" width="135" height="28" rx="7" fill="rgba(148,164,145,0.18)"/>
  <text x="127.5" y="469" text-anchor="middle" fill="#1a1a1a" font-size="15">CO₂ calculation</text>
  <rect x="60" y="484" width="169" height="28" rx="7" fill="rgba(148,164,145,0.18)"/>
  <text x="144.5" y="503" text-anchor="middle" fill="#1a1a1a" font-size="15">Project management</text>

  <!-- CLIMATE PROJECTS -->
  <rect x="40" y="632" width="330" height="124" rx="16" fill="none" stroke="#94a491" stroke-width="1.5"/>
  <text x="60" y="675" fill="#1a1a1a" font-size="21" font-weight="700">Climate projects</text>
  <rect x="60" y="692" width="97" height="28" rx="7" fill="rgba(148,164,145,0.18)"/>
  <text x="108.5" y="711" text-anchor="middle" fill="#1a1a1a" font-size="15">Validation</text>
  <rect x="165" y="692" width="107" height="28" rx="7" fill="rgba(148,164,145,0.18)"/>
  <text x="218.5" y="711" text-anchor="middle" fill="#1a1a1a" font-size="15">Verification</text>

  <!-- ===== RIGHT COLUMN ===== -->
  <!-- REGULATED ORGANISATIONS -->
  <rect x="830" y="150" width="330" height="139" rx="16" fill="none" stroke="#94a491" stroke-width="1.5"/>
  <text x="850" y="187" fill="#1a1a1a" font-size="21" font-weight="700">Regulated organisations</text>
  <rect x="850" y="203" width="219" height="28" rx="7" fill="rgba(148,164,145,0.18)"/>
  <text x="959.5" y="222" text-anchor="middle" fill="#1a1a1a" font-size="15">~30 regulated organisations</text>
  <rect x="850" y="237" width="120" height="28" rx="7" fill="rgba(148,164,145,0.18)"/>
  <text x="910" y="256" text-anchor="middle" fill="#1a1a1a" font-size="15">Project office</text>

  <!-- CARBON UNITS REGISTRY OPERATOR -->
  <rect x="830" y="378" width="330" height="124" rx="16" fill="none" stroke="#94a491" stroke-width="1.5"/>
  <text x="850" y="414" fill="#1a1a1a" font-size="21" font-weight="700">Operator of the Carbon</text>
  <text x="850" y="439" fill="#1a1a1a" font-size="21" font-weight="700">Units Registry</text>
  <rect x="850" y="454" width="122" height="28" rx="7" fill="rgba(148,164,145,0.18)"/>
  <text x="911" y="473" text-anchor="middle" fill="#1a1a1a" font-size="15">JSC "Kontur"</text>

  <!-- TRADING PLATFORMS -->
  <rect x="830" y="632" width="330" height="124" rx="16" fill="none" stroke="#94a491" stroke-width="1.5"/>
  <text x="850" y="675" fill="#1a1a1a" font-size="21" font-weight="700">Trading platforms</text>
  <rect x="850" y="692" width="142" height="28" rx="7" fill="rgba(148,164,145,0.18)"/>
  <text x="921" y="711" text-anchor="middle" fill="#1a1a1a" font-size="15">Test transaction</text>
</svg>
