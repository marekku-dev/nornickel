<svg viewBox="0 0 460 1371" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Mabry Pro', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Regional stakeholder model for carbon regulation</title>
  <desc>Vertical diagram: experiment coordinator and authorised body, then “The experiment’s scope”, followed by regulated organisations, the Carbon Units Registry operator, trading platforms and climate projects.</desc>
  <defs>
    <marker id="arrowM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a491"/>
    </marker>
  </defs>

  <!-- EXPERIMENT COORDINATOR -->
  <rect x="30" y="20" width="400" height="149" rx="16" fill="none" stroke="#94a491" stroke-width="1.5"/>
  <text x="55" y="62" fill="#1a1a1a" font-size="22" font-weight="700">Experiment coordinator</text>
  <text x="55" y="89" fill="rgba(26,26,26,0.55)" font-size="16">Federal executive authority –</text>
  <text x="55" y="108" fill="rgba(26,26,26,0.55)" font-size="16">Russian Ministry of Economic Development</text>
  <rect x="55" y="124" width="114" height="30" rx="7" fill="rgba(148,164,145,0.18)"/>
  <text x="112" y="145" text-anchor="middle" fill="#1a1a1a" font-size="16">Regulations</text>

  <path d="M230,179 L230,219" stroke="#94a491" stroke-width="2.5" fill="none" marker-end="url(#arrowM)"/>

  <!-- AUTHORISED BODY -->
  <rect x="30" y="229" width="400" height="149" rx="16" fill="none" stroke="#94a491" stroke-width="1.5"/>
  <text x="55" y="271" fill="#1a1a1a" font-size="22" font-weight="700">Authorised body</text>
  <text x="55" y="297" fill="rgba(26,26,26,0.55)" font-size="15">Regional executive authority –</text>
  <text x="55" y="316" fill="rgba(26,26,26,0.55)" font-size="15">Government of the Sakhalin Region</text>
  <rect x="55" y="332" width="142" height="30" rx="7" fill="rgba(148,164,145,0.18)"/>
  <text x="126" y="353" text-anchor="middle" fill="#1a1a1a" font-size="16">CO₂ calculation</text>
  <rect x="205" y="332" width="179" height="30" rx="7" fill="rgba(148,164,145,0.18)"/>
  <text x="294.5" y="353" text-anchor="middle" fill="#1a1a1a" font-size="16">Project management</text>

  <path d="M230,388 L230,428" stroke="#94a491" stroke-width="2" fill="none" marker-end="url(#arrowM)"/>

  <!-- CENTRE -->
  <circle cx="230" cy="563" r="135" fill="none" stroke="#94a491" stroke-width="1.5"/>
  <text x="230" y="541" text-anchor="middle" fill="#1a1a1a" font-size="14" font-weight="700">Federal Laws No. 296-FZ and 34-FZ</text>
  <text x="230" y="576" text-anchor="middle" fill="#1a1a1a" font-size="24" font-weight="700">The experiment’s</text>
  <text x="230" y="605" text-anchor="middle" fill="#1a1a1a" font-size="24" font-weight="700">scope</text>

  <path d="M230,708 L230,748" stroke="#94a491" stroke-width="2.5" fill="none" marker-end="url(#arrowM)"/>

  <!-- REGULATED ORGANISATIONS -->
  <rect x="30" y="758" width="400" height="149" rx="16" fill="none" stroke="#94a491" stroke-width="1.5"/>
  <text x="55" y="802" fill="#1a1a1a" font-size="22" font-weight="700">Regulated organisations</text>
  <rect x="55" y="819" width="231" height="30" rx="7" fill="rgba(148,164,145,0.18)"/>
  <text x="170.5" y="840" text-anchor="middle" fill="#1a1a1a" font-size="16">~30 regulated organisations</text>
  <rect x="55" y="857" width="126" height="30" rx="7" fill="rgba(148,164,145,0.18)"/>
  <text x="118" y="878" text-anchor="middle" fill="#1a1a1a" font-size="16">Project office</text>

  <!-- CARBON UNITS REGISTRY OPERATOR -->
  <rect x="30" y="923" width="400" height="136" rx="16" fill="none" stroke="#94a491" stroke-width="1.5"/>
  <text x="55" y="967" fill="#1a1a1a" font-size="22" font-weight="700">Operator of the Carbon</text>
  <text x="55" y="993" fill="#1a1a1a" font-size="22" font-weight="700">Units Registry</text>
  <rect x="55" y="1009" width="128" height="30" rx="7" fill="rgba(148,164,145,0.18)"/>
  <text x="119" y="1030" text-anchor="middle" fill="#1a1a1a" font-size="16">JSC "Kontur"</text>

  <!-- TRADING PLATFORMS -->
  <rect x="30" y="1075" width="400" height="110" rx="16" fill="none" stroke="#94a491" stroke-width="1.5"/>
  <text x="55" y="1119" fill="#1a1a1a" font-size="22" font-weight="700">Trading platforms</text>
  <rect x="55" y="1135" width="149" height="30" rx="7" fill="rgba(148,164,145,0.18)"/>
  <text x="129.5" y="1156" text-anchor="middle" fill="#1a1a1a" font-size="16">Test transaction</text>

  <!-- CLIMATE PROJECTS -->
  <rect x="30" y="1201" width="400" height="115" rx="16" fill="none" stroke="#94a491" stroke-width="1.5"/>
  <text x="55" y="1245" fill="#1a1a1a" font-size="22" font-weight="700">Climate projects</text>
  <rect x="55" y="1262" width="101" height="30" rx="7" fill="rgba(148,164,145,0.18)"/>
  <text x="105.5" y="1283" text-anchor="middle" fill="#1a1a1a" font-size="16">Validation</text>
  <rect x="164" y="1262" width="113" height="30" rx="7" fill="rgba(148,164,145,0.18)"/>
  <text x="220.5" y="1283" text-anchor="middle" fill="#1a1a1a" font-size="16">Verification</text>
</svg>
